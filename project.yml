# After edits: xcodegen generate && pod install
# Open WishSaver.xcworkspace.
name: WishSaver
options:
  bundleIdPrefix: com.wangyao
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
targets:
  WishSaver:
    type: application
    platform: iOS
    sources:
      - path: WishSaver
        excludes:
          - Info.plist
          - WishSaver-Bridging-Header.h
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangyao.wishsaver
        PRODUCT_NAME: WishSaver
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WishSaver/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Wish Saver"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_UILaunchStoryboardName: WishLaunchScreen
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_OBJC_BRIDGING_HEADER: WishSaver/WishSaver-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: WishSaver/WishSaver.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: WishSaver/WishSaver-Release.entitlements
schemes:
  WishSaver:
    build:
      targets:
        WishSaver: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
